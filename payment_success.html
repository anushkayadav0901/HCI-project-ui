<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centpercent – Payment Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0 auto;
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      width: 390px;
      min-height: 844px;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .status-bar .time { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 16px; height: 16px; fill: #FAFAFA; }

    /* ── Success Center ── */
    .success-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      gap: 12px;
      padding-bottom: 20px;
    }

    /* Checkmark animation */
    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes ring-pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
      100% { box-shadow: 0 0 0 20px rgba(52, 211, 153, 0); }
    }

    .check-circle {
      width: 80px; height: 80px;
      background: #34D399;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, ring-pulse 1.5s ease-out 0.4s infinite;
      margin-bottom: 8px;
    }
    .check-circle svg { width: 40px; height: 40px; }

    .success-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #FAFAFA;
    }
    .success-amount {
      font-family: 'DM Sans', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #34D399;
      font-variant-numeric: tabular-nums;
    }
    .success-to {
      font-size: 14px;
      color: #71717A;
    }
    .txn-id {
      font-size: 11px;
      color: #71717A;
      font-variant-numeric: tabular-nums;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 8px;
      padding: 6px 12px;
      margin-top: 4px;
    }

    /* ── Divider OR ── */
    .divider-or {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 8px 0;
    }
    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #27272A;
    }
    .divider-or span { font-size: 12px; color: #71717A; }

    /* ── Save Nudge Card ── */
    .save-nudge {
      width: 100%;
      background: #18181B;
      border: 1px solid #6C47FF;
      border-radius: 14px;
      padding: 16px;
    }
    .nudge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .nudge-text {
      font-size: 14px;
      font-weight: 500;
      color: #FAFAFA;
      flex: 1;
    }
    .nudge-emoji { font-size: 18px; margin-left: 4px; }
    .nudge-actions {
      display: flex;
      gap: 8px;
    }
    .nudge-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .nudge-btn.yes {
      background: #6C47FF;
      color: #FAFAFA;
    }
    .nudge-btn.yes:hover { background: #7C5CFF; }
    .nudge-btn.skip {
      background: #27272A;
      color: #A1A1AA;
    }
    .nudge-btn.skip:hover { background: #3f3f46; color: #FAFAFA; }

    /* ── Bottom Actions ── */
    .bottom-actions {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      width: 100%;
      height: 52px;
      background: #6C47FF;
      color: #FAFAFA;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #7C5CFF; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      width: 100%;
      height: 52px;
      background: transparent;
      color: #D4D4D8;
      border: 1px solid #27272A;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: #18181B; border-color: #3f3f46; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      background: #18181B;
      border-top: 1px solid #27272A;
      display: flex;
      padding: 8px 0 20px;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
    }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; color: #71717A; font-weight: 500; }
    .nav-item.active .nav-label { color: #6C47FF; }
    .nav-active-dot {
      width: 4px; height: 4px;
      background: #6C47FF;
      border-radius: 50%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="1" y="13" width="4" height="8" rx="1"/><rect x="7" y="9" width="4" height="12" rx="1"/><rect x="13" y="5" width="4" height="16" rx="1"/><rect x="19" y="1" width="4" height="20" rx="1" opacity="0.35"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1.5 8.5a15 15 0 0 1 21 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12.5a10 10 0 0 1 14 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="#FAFAFA"/></svg>
      <svg viewBox="0 0 28 14"><rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="#FAFAFA" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#FAFAFA"/><path d="M25 4.5v5a2 2 0 0 0 0-5z" fill="#FAFAFA" opacity="0.5"/></svg>
    </div>
  </div>

  <!-- Success Center -->
  <div class="success-center">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="success-title">Payment Sent!</div>
    <div class="success-amount">₹ 500</div>
    <div class="success-to">To: Priya Sharma</div>
    <div class="txn-id">#TXN2024110001</div>

    <div class="divider-or"><span>or</span></div>

    <!-- Save Nudge -->
    <div class="save-nudge">
      <div class="nudge-row">
        <div class="nudge-text">
          Save ₹50 from this payment? <span class="nudge-emoji">🎯</span>
        </div>
        <div class="nudge-actions">
          <button class="nudge-btn yes">Yes</button>
          <button class="nudge-btn skip">Skip</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Action Buttons -->
  <div class="bottom-actions">
    <button class="btn-secondary">New Payment</button>
    <button class="btn-primary">Go Home</button>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </div>
    <div class="nav-item active">
      <div class="nav-icon">💸</div>
      <div class="nav-label" style="color:#6C47FF;">Payments</div>
      <div class="nav-active-dot"></div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Expenses</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏦</div>
      <div class="nav-label">Savings</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📚</div>
      <div class="nav-label">Learn</div>
    </div>
  </nav>

</body>
</html>
