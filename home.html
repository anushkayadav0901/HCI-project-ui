<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centpercent – Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0 auto;
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      width: 390px;
      min-height: 844px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .status-bar .time { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 16px; height: 16px; fill: #FAFAFA; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
    }
    .greeting-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #FAFAFA;
    }
    .greeting-date {
      font-size: 13px;
      color: #71717A;
      margin-top: 2px;
    }
    .notif-btn {
      width: 40px; height: 40px;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .notif-btn:hover { background: #27272A; }
    .notif-dot {
      position: absolute; top: 8px; right: 9px;
      width: 7px; height: 7px;
      background: #6C47FF; border-radius: 50%;
      border: 1.5px solid #09090B;
    }

    /* ── Main Scroll Area ── */
    .scroll-area {
      padding: 0 16px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Balance Hero Card ── */
    .balance-card {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 20px;
      padding: 24px;
    }
    .balance-label {
      font-size: 12px;
      color: #71717A;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .balance-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .balance-amount {
      font-family: 'DM Sans', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #FAFAFA;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #71717A;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .eye-btn:hover { color: #FAFAFA; }

    .divider { height: 1px; background: #27272A; margin: 0 0 20px; }

    .stat-pills {
      display: flex;
      gap: 10px;
    }
    .stat-pill {
      flex: 1;
      background: #27272A;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .stat-pill-label {
      font-size: 11px;
      color: #71717A;
      margin-bottom: 4px;
    }
    .stat-pill-value {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #FAFAFA;
      font-variant-numeric: tabular-nums;
    }

    /* ── Quick Actions ── */
    .quick-actions {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .action-circle {
      width: 56px; height: 56px;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: background 0.15s, transform 0.1s;
    }
    .action-circle:hover { background: #27272A; transform: scale(1.05); }
    .action-label {
      font-size: 11px;
      color: #71717A;
      text-align: center;
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #FAFAFA;
    }
    .see-all {
      font-size: 13px;
      color: #6C47FF;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .see-all:hover { opacity: 0.75; }

    /* ── Transactions ── */
    .transactions-list {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 14px;
      overflow: hidden;
    }
    .txn-row {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 16px;
      position: relative;
      transition: background 0.1s;
      cursor: pointer;
    }
    .txn-row:hover { background: #1f1f23; }
    .txn-row + .txn-row::before {
      content: '';
      position: absolute;
      top: 0; left: 56px; right: 0;
      height: 1px;
      background: #27272A;
    }
    .txn-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .txn-icon.swiggy { background: #2C1A0E; }
    .txn-icon.starbucks { background: #0E2416; }
    .txn-icon.salary { background: #0D1F17; }

    .txn-info { flex: 1; min-width: 0; }
    .txn-name {
      font-size: 14px;
      font-weight: 500;
      color: #FAFAFA;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .txn-date { font-size: 12px; color: #71717A; margin-top: 2px; }

    .txn-amount {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .txn-amount.debit { color: #F87171; }
    .txn-amount.credit { color: #34D399; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      background: #18181B;
      border-top: 1px solid #27272A;
      display: flex;
      padding: 8px 0 20px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
      transition: opacity 0.15s;
    }
    .nav-item:hover { opacity: 0.8; }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; color: #71717A; font-weight: 500; }
    .nav-item.active .nav-label { color: #6C47FF; }
    .nav-item.active .nav-icon { filter: none; }
    .nav-active-dot {
      width: 4px; height: 4px;
      background: #6C47FF;
      border-radius: 50%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <!-- Signal -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="13" width="4" height="8" rx="1"/><rect x="7" y="9" width="4" height="12" rx="1"/><rect x="13" y="5" width="4" height="16" rx="1"/><rect x="19" y="1" width="4" height="20" rx="1" opacity="0.35"/></svg>
      <!-- Wifi -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 8.5a15 15 0 0 1 21 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12.5a10 10 0 0 1 14 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="#FAFAFA"/></svg>
      <!-- Battery -->
      <svg viewBox="0 0 28 14" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="#FAFAFA" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#FAFAFA"/><path d="M25 4.5v5a2 2 0 0 0 0-5z" fill="#FAFAFA" opacity="0.5"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div>
      <div class="greeting-name">Hey Anushka 👋</div>
      <div class="greeting-date">Tuesday, 11 Nov</div>
    </div>
    <button class="notif-btn" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D4D4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="notif-dot"></div>
    </button>
  </div>

  <!-- Scroll Area -->
  <div class="scroll-area">

    <!-- Balance Hero -->
    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-row">
        <div class="balance-amount">₹ 24,500.00</div>
        <button class="eye-btn" aria-label="Toggle visibility">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="divider"></div>
      <div class="stat-pills">
        <div class="stat-pill">
          <div class="stat-pill-label">Monthly Spent</div>
          <div class="stat-pill-value">₹8,200</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-label">Budget Left</div>
          <div class="stat-pill-value">₹6,800</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <div class="action-item">
        <div class="action-circle">📤</div>
        <div class="action-label">Send</div>
      </div>
      <div class="action-item">
        <div class="action-circle">📥</div>
        <div class="action-label">Receive</div>
      </div>
      <div class="action-item">
        <div class="action-circle">📷</div>
        <div class="action-label">Scan QR</div>
      </div>
      <div class="action-item">
        <div class="action-circle">🤝</div>
        <div class="action-label">Split</div>
      </div>
    </div>

    <!-- Recent Transactions -->
    <div>
      <div class="section-header" style="margin-bottom: 12px;">
        <div class="section-title">Recent Transactions</div>
        <div class="see-all">See all</div>
      </div>

      <div class="transactions-list">
        <div class="txn-row">
          <div class="txn-icon swiggy">🍔</div>
          <div class="txn-info">
            <div class="txn-name">Swiggy</div>
            <div class="txn-date">Yesterday</div>
          </div>
          <div class="txn-amount debit">−₹340</div>
        </div>
        <div class="txn-row">
          <div class="txn-icon starbucks">☕</div>
          <div class="txn-info">
            <div class="txn-name">Starbucks</div>
            <div class="txn-date">2 days ago</div>
          </div>
          <div class="txn-amount debit">−₹450</div>
        </div>
        <div class="txn-row">
          <div class="txn-icon salary">💼</div>
          <div class="txn-info">
            <div class="txn-name">Salary</div>
            <div class="txn-date">5 Nov</div>
          </div>
          <div class="txn-amount credit">+₹15,000</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      <div class="nav-label" style="color:#6C47FF;">Home</div>
      <div class="nav-active-dot"></div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">💸</div>
      <div class="nav-label">Payments</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Expenses</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏦</div>
      <div class="nav-label">Savings</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📚</div>
      <div class="nav-label">Learn</div>
    </div>
  </nav>

</body>
</html>
