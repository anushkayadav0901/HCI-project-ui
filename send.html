<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centpercent – Send Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0 auto;
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      width: 390px;
      min-height: 844px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .status-bar .time { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 16px; height: 16px; fill: #FAFAFA; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px 16px;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: #27272A; }
    .header-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FAFAFA;
    }

    /* ── Content ── */
    .content {
      padding: 0 16px;
      padding-bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Search ── */
    .search-wrapper {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #71717A;
    }
    .search-input {
      width: 100%;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 12px;
      padding: 14px 14px 14px 42px;
      font-size: 14px;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: #71717A; }
    .search-input:focus { border-color: #6C47FF; }

    /* ── Recent Contacts ── */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .contacts-row {
      display: flex;
      gap: 20px;
    }
    .contact-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .contact-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FAFAFA;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .contact-avatar:hover { transform: scale(1.06); }
    .contact-avatar.priya { background: linear-gradient(135deg, #6C47FF, #9B72FF); }
    .contact-avatar.ravi  { background: linear-gradient(135deg, #0EA5E9, #38BDF8); }
    .contact-avatar.neha  { background: linear-gradient(135deg, #F97316, #FB923C); }
    .contact-name { font-size: 12px; color: #D4D4D8; text-align: center; }

    /* ── Amount Section ── */
    .amount-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 8px;
    }
    .amount-display {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      border-bottom: 2px solid #27272A;
      padding-bottom: 8px;
      width: 100%;
      justify-content: center;
      transition: border-color 0.2s;
    }
    .amount-display:focus-within { border-bottom-color: #6C47FF; }
    .amount-prefix {
      font-family: 'DM Sans', sans-serif;
      font-size: 32px;
      font-weight: 500;
      color: #71717A;
      padding-bottom: 2px;
    }
    .amount-input {
      background: none;
      border: none;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #FAFAFA;
      font-variant-numeric: tabular-nums;
      text-align: center;
      width: 180px;
      caret-color: #6C47FF;
    }
    .amount-input::placeholder { color: #71717A; }

    .quick-chips {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: #27272A;
      border: 1px solid #3f3f46;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #D4D4D8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-variant-numeric: tabular-nums;
    }
    .chip:hover { background: #3f3f46; color: #FAFAFA; border-color: #6C47FF; }

    /* ── Note Input ── */
    .note-input {
      width: 100%;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      outline: none;
      resize: none;
      transition: border-color 0.15s;
    }
    .note-input::placeholder { color: #71717A; }
    .note-input:focus { border-color: #6C47FF; }

    /* ── CTA ── */
    .cta-btn {
      width: 100%;
      height: 52px;
      background: #6C47FF;
      color: #FAFAFA;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    .cta-btn:hover { background: #7C5CFF; }
    .cta-btn:active { transform: scale(0.98); }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      background: #18181B;
      border-top: 1px solid #27272A;
      display: flex;
      padding: 8px 0 20px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
    }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; color: #71717A; font-weight: 500; }
    .nav-item.active .nav-label { color: #6C47FF; }
    .nav-active-dot {
      width: 4px; height: 4px;
      background: #6C47FF;
      border-radius: 50%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="1" y="13" width="4" height="8" rx="1"/><rect x="7" y="9" width="4" height="12" rx="1"/><rect x="13" y="5" width="4" height="16" rx="1"/><rect x="19" y="1" width="4" height="20" rx="1" opacity="0.35"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1.5 8.5a15 15 0 0 1 21 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12.5a10 10 0 0 1 14 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="#FAFAFA"/></svg>
      <svg viewBox="0 0 28 14"><rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="#FAFAFA" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#FAFAFA"/><path d="M25 4.5v5a2 2 0 0 0 0-5z" fill="#FAFAFA" opacity="0.5"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <button class="back-btn" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <div class="header-title">Send Money</div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Search -->
    <div class="search-wrapper">
      <div class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </div>
      <input class="search-input" type="text" placeholder="Search name or UPI ID" />
    </div>

    <!-- Recent Contacts -->
    <div>
      <div class="section-label">Recent</div>
      <div class="contacts-row">
        <div class="contact-item">
          <div class="contact-avatar priya">PS</div>
          <div class="contact-name">Priya</div>
        </div>
        <div class="contact-item">
          <div class="contact-avatar ravi">RK</div>
          <div class="contact-name">Ravi</div>
        </div>
        <div class="contact-item">
          <div class="contact-avatar neha">NM</div>
          <div class="contact-name">Neha</div>
        </div>
      </div>
    </div>

    <!-- Amount Input -->
    <div class="amount-section">
      <div class="amount-display">
        <span class="amount-prefix">₹</span>
        <input class="amount-input" type="number" placeholder="0" min="0" inputmode="numeric" />
      </div>
      <div class="quick-chips">
        <div class="chip">₹100</div>
        <div class="chip">₹500</div>
        <div class="chip">₹1,000</div>
        <div class="chip">₹2,000</div>
      </div>
    </div>

    <!-- Note -->
    <textarea class="note-input" rows="2" placeholder="Add a note (optional)"></textarea>

    <!-- CTA -->
    <button class="cta-btn">Send Money</button>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </div>
    <div class="nav-item active">
      <div class="nav-icon">💸</div>
      <div class="nav-label" style="color:#6C47FF;">Payments</div>
      <div class="nav-active-dot"></div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Expenses</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏦</div>
      <div class="nav-label">Savings</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📚</div>
      <div class="nav-label">Learn</div>
    </div>
  </nav>

</body>
</html>
