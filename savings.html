<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centpercent – Savings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0 auto;
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      width: 390px;
      min-height: 844px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .status-bar .time { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 16px; height: 16px; fill: #FAFAFA; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
    }
    .header-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #FAFAFA;
    }
    .streak-pill {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #FBBF24;
    }

    /* ── Content ── */
    .content {
      padding: 8px 16px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Hero Card ── */
    .hero-card {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 20px;
      padding: 24px;
    }
    .hero-label {
      font-size: 12px;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .hero-amount {
      font-family: 'DM Sans', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #FAFAFA;
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }
    .hero-goal {
      font-size: 13px;
      color: #71717A;
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 8px;
      background: #27272A;
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #6C47FF;
      border-radius: 100px;
      transition: width 0.6s ease;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }
    .progress-pct {
      font-size: 12px;
      color: #6C47FF;
      font-weight: 600;
    }
    .progress-rem {
      font-size: 12px;
      color: #71717A;
      font-variant-numeric: tabular-nums;
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #FAFAFA;
    }

    /* ── Goals Grid ── */
    .goals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .goal-card {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .goal-emoji { font-size: 22px; }
    .goal-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .goal-amount {
      font-size: 12px;
      color: #71717A;
      font-variant-numeric: tabular-nums;
    }
    .goal-amount span {
      color: #D4D4D8;
      font-weight: 500;
    }
    .goal-track {
      height: 5px;
      background: #27272A;
      border-radius: 100px;
      overflow: hidden;
    }
    .goal-fill {
      height: 100%;
      background: #6C47FF;
      border-radius: 100px;
    }
    .goal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .goal-pct {
      font-size: 12px;
      font-weight: 600;
      color: #6C47FF;
    }
    .goal-days {
      font-size: 11px;
      color: #71717A;
    }

    /* ── Create Goal Button ── */
    .btn-outline {
      width: 100%;
      height: 48px;
      background: transparent;
      color: #6C47FF;
      border: 1px solid #6C47FF;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: rgba(108, 71, 255, 0.1); }

    /* ── Insight Card ── */
    .insight-card {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .insight-icon { font-size: 22px; }
    .insight-text {
      font-size: 14px;
      color: #34D399;
      font-weight: 500;
      line-height: 1.4;
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      background: #18181B;
      border-top: 1px solid #27272A;
      display: flex;
      padding: 8px 0 20px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
    }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; color: #71717A; font-weight: 500; }
    .nav-item.active .nav-label { color: #6C47FF; }
    .nav-active-dot {
      width: 4px; height: 4px;
      background: #6C47FF;
      border-radius: 50%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="1" y="13" width="4" height="8" rx="1"/><rect x="7" y="9" width="4" height="12" rx="1"/><rect x="13" y="5" width="4" height="16" rx="1"/><rect x="19" y="1" width="4" height="20" rx="1" opacity="0.35"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1.5 8.5a15 15 0 0 1 21 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12.5a10 10 0 0 1 14 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="#FAFAFA"/></svg>
      <svg viewBox="0 0 28 14"><rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="#FAFAFA" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#FAFAFA"/><path d="M25 4.5v5a2 2 0 0 0 0-5z" fill="#FAFAFA" opacity="0.5"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-title">Savings</div>
    <div class="streak-pill">🔥 12 day streak</div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-label">Total Saved</div>
      <div class="hero-amount">₹ 48,200</div>
      <div class="hero-goal">Goal: ₹1,00,000</div>
      <div class="progress-track">
        <div class="progress-fill" style="width: 48.2%;"></div>
      </div>
      <div class="progress-labels">
        <div class="progress-pct">48.2% reached</div>
        <div class="progress-rem">₹51,800 to go</div>
      </div>
    </div>

    <!-- Goals Section -->
    <div>
      <div class="section-header" style="margin-bottom: 12px;">
        <div class="section-title">Your Goals</div>
      </div>
      <div class="goals-grid">

        <!-- Goal 1: Goa -->
        <div class="goal-card">
          <div class="goal-emoji">🏖️</div>
          <div>
            <div class="goal-name">Goa Trip</div>
            <div class="goal-amount"><span>₹13,500</span> / ₹20,000</div>
          </div>
          <div class="goal-track">
            <div class="goal-fill" style="width: 68%;"></div>
          </div>
          <div class="goal-footer">
            <div class="goal-pct">68%</div>
            <div class="goal-days">45 days left</div>
          </div>
        </div>

        <!-- Goal 2: Phone -->
        <div class="goal-card">
          <div class="goal-emoji">📱</div>
          <div>
            <div class="goal-name">New Phone</div>
            <div class="goal-amount"><span>₹8,200</span> / ₹15,000</div>
          </div>
          <div class="goal-track">
            <div class="goal-fill" style="width: 55%;"></div>
          </div>
          <div class="goal-footer">
            <div class="goal-pct">55%</div>
            <div class="goal-days">60 days left</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Create Goal -->
    <button class="btn-outline">+ Create New Goal</button>

    <!-- Insight -->
    <div class="insight-card">
      <div class="insight-icon">📈</div>
      <div class="insight-text">You saved ₹2,000 more than last month!</div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">💸</div>
      <div class="nav-label">Payments</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Expenses</div>
    </div>
    <div class="nav-item active">
      <div class="nav-icon">🏦</div>
      <div class="nav-label" style="color:#6C47FF;">Savings</div>
      <div class="nav-active-dot"></div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📚</div>
      <div class="nav-label">Learn</div>
    </div>
  </nav>

</body>
</html>
