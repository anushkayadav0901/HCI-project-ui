<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centpercent – Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0 auto;
      background: #09090B;
      color: #FAFAFA;
      font-family: 'Inter', sans-serif;
      width: 390px;
      min-height: 844px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Status Bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #FAFAFA;
    }
    .status-bar .time { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 16px; height: 16px; fill: #FAFAFA; }

    /* ── Header ── */
    .header {
      padding: 12px 20px 8px;
    }
    .header-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #FAFAFA;
    }

    /* ── Content ── */
    .content {
      padding: 8px 16px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Featured Course Card ── */
    .featured-card {
      background: linear-gradient(135deg, #1E1340 0%, #18181B 100%);
      border: 1px solid #3730A3;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .featured-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(108,71,255,0.25) 0%, transparent 70%);
      border-radius: 50%;
    }
    .featured-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108, 71, 255, 0.2);
      border: 1px solid rgba(108, 71, 255, 0.4);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #A78BFA;
      margin-bottom: 12px;
    }
    .featured-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #FAFAFA;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .featured-meta {
      font-size: 13px;
      color: #71717A;
      margin-bottom: 20px;
    }
    .featured-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #6C47FF;
      color: #FAFAFA;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .featured-cta:hover { background: #7C5CFF; }
    .featured-cta:active { transform: scale(0.97); }

    /* ── Section Header ── */
    .section-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #FAFAFA;
    }

    /* ── Course List ── */
    .courses-list {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 14px;
      overflow: hidden;
    }
    .course-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }
    .course-row:hover { background: #1f1f23; }
    .course-row + .course-row::before {
      content: '';
      position: absolute;
      top: 0; left: 56px; right: 0;
      height: 1px;
      background: #27272A;
    }
    .course-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #27272A;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #A1A1AA;
      flex-shrink: 0;
    }
    .course-num.done { background: rgba(52, 211, 153, 0.15); color: #34D399; }
    .course-info { flex: 1; min-width: 0; }
    .course-name {
      font-size: 14px;
      font-weight: 500;
      color: #FAFAFA;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-progress-track {
      height: 4px;
      background: #27272A;
      border-radius: 100px;
      overflow: hidden;
      width: 100%;
    }
    .course-progress-fill {
      height: 100%;
      background: #6C47FF;
      border-radius: 100px;
    }
    .course-pill {
      flex-shrink: 0;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .pill-done { background: rgba(52,211,153,0.15); color: #34D399; }
    .pill-progress { background: rgba(108,71,255,0.15); color: #A78BFA; }
    .pill-muted { background: #27272A; color: #71717A; }

    /* ── Quiz Promo ── */
    .quiz-card {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .quiz-left { flex: 1; }
    .quiz-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #FAFAFA;
      margin-bottom: 4px;
    }
    .quiz-sub {
      font-size: 12px;
      color: #71717A;
    }
    .quiz-btn {
      background: #27272A;
      color: #D4D4D8;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .quiz-btn:hover { background: #6C47FF; color: #FAFAFA; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      background: #18181B;
      border-top: 1px solid #27272A;
      display: flex;
      padding: 8px 0 20px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
    }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; color: #71717A; font-weight: 500; }
    .nav-item.active .nav-label { color: #6C47FF; }
    .nav-active-dot {
      width: 4px; height: 4px;
      background: #6C47FF;
      border-radius: 50%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="1" y="13" width="4" height="8" rx="1"/><rect x="7" y="9" width="4" height="12" rx="1"/><rect x="13" y="5" width="4" height="16" rx="1"/><rect x="19" y="1" width="4" height="20" rx="1" opacity="0.35"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1.5 8.5a15 15 0 0 1 21 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12.5a10 10 0 0 1 14 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#FAFAFA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="#FAFAFA"/></svg>
      <svg viewBox="0 0 28 14"><rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="#FAFAFA" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="18" height="10" rx="1.5" fill="#FAFAFA"/><path d="M25 4.5v5a2 2 0 0 0 0-5z" fill="#FAFAFA" opacity="0.5"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-title">Learn</div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Featured Course -->
    <div class="featured-card">
      <div class="featured-badge">💡 Financial Basics</div>
      <div class="featured-title">Build your money mindset</div>
      <div class="featured-meta">12 lessons · 2h 30m</div>
      <button class="featured-cta">Start Course →</button>
    </div>

    <!-- Your Courses -->
    <div>
      <div class="section-title" style="margin-bottom: 12px;">Your Courses</div>
      <div class="courses-list">

        <!-- Course 1: Completed -->
        <div class="course-row">
          <div class="course-num done">✓</div>
          <div class="course-info">
            <div class="course-name">Cash Flow Basics</div>
          </div>
          <div class="course-pill pill-done">Completed</div>
        </div>

        <!-- Course 2: In progress -->
        <div class="course-row">
          <div class="course-num">2</div>
          <div class="course-info">
            <div class="course-name">Budgeting 101</div>
            <div class="course-progress-track">
              <div class="course-progress-fill" style="width: 37.5%;"></div>
            </div>
          </div>
          <div class="course-pill pill-progress">3/8</div>
        </div>

        <!-- Course 3: Not started -->
        <div class="course-row">
          <div class="course-num">3</div>
          <div class="course-info">
            <div class="course-name">Tax for Students</div>
          </div>
          <div class="course-pill pill-muted">Not started</div>
        </div>

      </div>
    </div>

    <!-- Quiz Promo -->
    <div class="quiz-card">
      <div class="quiz-left">
        <div class="quiz-title">Test your knowledge 🧠</div>
        <div class="quiz-sub">5 quick questions · 3 min</div>
      </div>
      <button class="quiz-btn">Take Quiz</button>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">💸</div>
      <div class="nav-label">Payments</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Expenses</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏦</div>
      <div class="nav-label">Savings</div>
    </div>
    <div class="nav-item active">
      <div class="nav-icon">📚</div>
      <div class="nav-label" style="color:#6C47FF;">Learn</div>
      <div class="nav-active-dot"></div>
    </div>
  </nav>

</body>
</html>
